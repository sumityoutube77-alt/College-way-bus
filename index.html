<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> College Way — Bus Playlist</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-left">
            <span class="current-time" id="currentTime">9:43 AM</span>
        </div>
        <div class="top-center">
            <span class="online-dot"></span>
            <span class="online-text"><span id="onlineCount">0</span> listening now</span>
        </div>
        <div class="top-right">
            <a href="https://youtube.com" target="_blank" class="yt-link">
                <i class="fab fa-youtube"></i> YouTube
            </a>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <h1 class="main-title">🚌 College Way</h1>
            <p class="subtitle">Bus Playlist • Hindi Songs • Non-Stop Music</p>
        </div>
    </section>

    <!-- Dashboard -->
    <section class="dashboard">
        <div class="dashboard-header">
            <h2>🎧 Today's Bus Playlist</h2>
            <p>Real YouTube • No Ads (Brave Browser) • Live Updates</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <span class="stat-number" id="statOnline">0</span>
                    <span class="stat-label">Listening Now</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-music"></i></div>
                <div class="stat-info">
                    <span class="stat-number">25</span>
                    <span class="stat-label">Total Songs</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-info">
                    <span class="stat-number">2h 15m</span>
                    <span class="stat-label">Duration</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-heart"></i></div>
                <div class="stat-info">
                    <span class="stat-number">847</span>
                    <span class="stat-label">Likes</span>
                </div>
            </div>
        </div>

        <!-- YouTube Player -->
        <div class="player-section">
            <div class="player-container">
                <div id="youtube-player"></div>
            </div>
        </div>

        <!-- Playlist -->
        <div class="playlist-section">
            <h3>📋 Bus Journey Playlist</h3>
            <div class="playlist-container" id="playlistContainer">
                <!-- Songs will be loaded here -->
            </div>
        </div>

        <!-- Now Playing Info -->
        <div class="now-playing-info">
            <div class="np-header">
                <i class="fas fa-music"></i>
                <span>Now Playing</span>
            </div>
            <div class="np-content">
                <h4 id="npTitle">Select a song to play</h4>
                <p id="npArtist">-</p>
            </div>
        </div>
    </section>

    <!-- Controls -->
    <div class="controls-bar">
        <button class="ctrl-btn" id="btnPrev" title="Previous">
            <i class="fas fa-step-backward"></i>
        </button>
        <button class="ctrl-btn play-btn" id="btnPlay" title="Play/Pause">
            <i class="fas fa-play" id="playIcon"></i>
        </button>
        <button class="ctrl-btn" id="btnNext" title="Next">
            <i class="fas fa-step-forward"></i>
        </button>
        <button class="ctrl-btn" id="btnShuffle" title="Shuffle">
            <i class="fas fa-random"></i>
        </button>
        <button class="ctrl-btn" id="btnRepeat" title="Repeat">
            <i class="fas fa-redo"></i>
        </button>
    </div>

    <script src="script.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
